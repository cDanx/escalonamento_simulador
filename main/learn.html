// ── Utilitários ───────────────────────────────────────────────────────────────

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function loadProgress() {
  try { const s = localStorage.getItem('learn:progress'); return s ? JSON.parse(s) : null; } catch { return null; }
}
function saveProgress(p) {
  try { localStorage.setItem('learn:progress', JSON.stringify(p)); } catch {}
}

// ── Tema ──────────────────────────────────────────────────────────────────────

// ── Componentes base ──────────────────────────────────────────────────────────

const cardStyle = {
  background: C.surface, border: `1px solid ${C.border}`,
  borderRadius: 14, padding: '24px 28px',
  boxShadow: '0 1px 4px rgba(0,0,0,0.05)',
};

const labelStyle = {
  fontSize: 11, fontWeight: 700, letterSpacing: '0.14em',
  textTransform: 'uppercase', marginBottom: 12,
};

function SectionBlock({ title, color, children }) {
  return (
    <div style={cardStyle}>
      {title && <div style={{ ...labelStyle, color: color || C.textMuted }}>{title}</div>}
      {children}
    </div>
  );
}

function P({ children, mt }) {
  return <p style={{ fontSize: 15, color: C.textSub, lineHeight: 1.7, marginTop: mt || 0 }}>{children}</p>;
}

// ── Conteúdo: Módulo 1 — Processos ───────────────────────────────────────────

function ProcessosContent({ color }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
      <SectionBlock title="Definição" color={color}>
        <P>Um processo é um programa em execução. Quando você abre um navegador, um editor de texto ou um jogo, o sistema operacional cria um processo para cada um deles.</P>
        <P mt={12}>Um processo não é apenas o código do programa — ele carrega consigo tudo que precisa para rodar: os dados que está usando, o ponto onde parou de executar e informações sobre os recursos que ocupa.</P>
      </SectionBlock>

      <SectionBlock title="O que um processo contém?" color={color}>
        <P>Cada processo possui um <strong>contexto</strong> — o conjunto de informações que o SO precisa guardar para pausar e retomar a execução a qualquer momento:</P>
        <div style={{ marginTop: 12, display: 'flex', flexDirection: 'column', gap: 8 }}>
          {['O código do programa que está sendo executado', 'Os dados em uso (variáveis, resultados parciais)', 'O estado atual (em qual instrução o processo está)', 'Referências à memória alocada para ele'].map((item, i) => (
            <div key={i} style={{ display: 'flex', gap: 10, fontSize: 14, color: C.textSub, lineHeight: 1.5 }}>
              <span style={{ color, fontWeight: 700, flexShrink: 0 }}>→</span>
              <span>{item}</span>
            </div>
          ))}
        </div>
      </SectionBlock>

      <SectionBlock title="Tipos de Processo" color={color}>
        <P>Processos se comportam de formas diferentes dependendo do que fazem. Existem dois perfis principais:</P>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginTop: 16 }}>
          <div style={{ background: '#fff7ed', border: '1px solid #fed7aa', borderRadius: 12, padding: '18px 20px' }}>
            <div style={{ fontWeight: 700, fontSize: 15, color: '#c2410c', marginBottom: 8 }}>⚡ CPU Bound</div>
            <p style={{ fontSize: 13, color: C.textSub, lineHeight: 1.6, marginBottom: 10 }}>Passa a maior parte do tempo realizando cálculos no processador.</p>
            <div style={{ fontSize: 12, color: '#c2410c', fontWeight: 600, marginBottom: 4 }}>Exemplos:</div>
            <p style={{ fontSize: 12, color: C.textSub, lineHeight: 1.5 }}>Renderização de vídeo, compressão de arquivos, simulações científicas.</p>
            <p style={{ marginTop: 10, fontSize: 12, color: C.textMuted, fontStyle: 'italic' }}>Usa pouco disco ou rede, mas ocupa o processador por longos períodos.</p>
          </div>
          <div style={{ background: '#eff6ff', border: '1px solid #bfdbfe', borderRadius: 12, padding: '18px 20px' }}>
            <div style={{ fontWeight: 700, fontSize: 15, color: '#1d4ed8', marginBottom: 8 }}>💾 IO Bound</div>
            <p style={{ fontSize: 13, color: C.textSub, lineHeight: 1.6, marginBottom: 10 }}>Passa a maior parte do tempo esperando por operações de entrada e saída.</p>
            <div style={{ fontSize: 12, color: '#1d4ed8', fontWeight: 600, marginBottom: 4 }}>Exemplos:</div>
            <p style={{ fontSize: 12, color: C.textSub, lineHeight: 1.5 }}>Navegador carregando página, editor de texto aguardando digitação.</p>
            <p style={{ marginTop: 10, fontSize: 12, color: C.textMuted, fontStyle: 'italic' }}>Usa pouco processador, mas passa muito tempo bloqueado esperando dados.</p>
          </div>
        </div>
      </SectionBlock>

      <SectionBlock title="Por que isso importa?" color={color}>
        <P>Saber se um processo é CPU bound ou IO bound ajuda o sistema operacional a tomar decisões mais inteligentes sobre quem deve usar o processador agora.</P>
        <P mt={10}>Se todos os processos forem CPU bound, o processador fica sobrecarregado. Se forem IO bound, ele fica ocioso. Um bom escalonador leva isso em conta.</P>
      </SectionBlock>
    </div>
  );
}

// ── Conteúdo: Módulo 2 — Estados ─────────────────────────────────────────────

function EstadosContent({ color }) {
  const estados = [
    { title: 'NEW', sub: 'Novo', desc: 'O processo foi criado, mas ainda não está pronto para executar. O SO está alocando recursos para ele.', analogy: 'Você se inscreveu em uma fila, mas ainda não recebeu sua senha.', bg: '#fafafa', border: '#d4d4d4', ac: '#737373' },
    { title: 'READY', sub: 'Pronto', desc: 'O processo está pronto para executar e aguardando o processador ficar disponível. Pode haver vários processos em READY ao mesmo tempo.', analogy: 'Você tem a senha na mão e está esperando ser chamado.', bg: '#fef9e7', border: '#f5d76e', ac: '#b7950b' },
    { title: 'RUNNING', sub: 'Executando', desc: 'O processo está efetivamente usando o processador. Em um núcleo, apenas um processo pode estar RUNNING por vez.', analogy: 'Você está sendo atendido no guichê.', bg: '#e8f5e9', border: '#66bb6a', ac: '#2e7d32' },
    { title: 'BLOCKED', sub: 'Bloqueado', desc: 'O processo está esperando por algo externo — leitura de disco, rede, entrada do usuário. Enquanto espera, libera o processador.', analogy: 'Você precisa buscar um documento. Sai do guichê e fica em espera.', bg: '#fdecec', border: '#ef9a9a', ac: '#c62828' },
    { title: 'TERMINATED', sub: 'Encerrado', desc: 'O processo terminou sua execução. O SO libera os recursos que ele ocupava.', analogy: 'Seu atendimento terminou. Você saiu.', bg: '#eceff1', border: '#90a4ae', ac: '#455a64' },
  ];

  const transitions = [
    { de: 'NEW', para: 'READY', quando: 'SO termina de preparar o processo' },
    { de: 'READY', para: 'RUNNING', quando: 'Escalonador escolhe o processo para executar' },
    { de: 'RUNNING', para: 'READY', quando: 'Tempo esgotado ou processo de maior prioridade aparece (preempção)' },
    { de: 'RUNNING', para: 'BLOCKED', quando: 'Processo solicita operação de entrada/saída' },
    { de: 'BLOCKED', para: 'READY', quando: 'A operação esperada foi concluída' },
    { de: 'RUNNING', para: 'TERMINATED', quando: 'Processo termina sua execução' },
  ];

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
      <SectionBlock title="Por que estados existem?" color={color}>
        <P>Em um sistema com vários processos rodando ao mesmo tempo, o processador só consegue executar <strong>um processo por vez</strong> (em um núcleo). Para gerenciar isso, o SO rastreia em qual situação cada processo se encontra — isso é o <strong>estado</strong> do processo.</P>
      </SectionBlock>

      <SectionBlock title="Os 5 estados" color={color}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
          {estados.map(e => (
            <div key={e.title} style={{ background: e.bg, border: `1.5px solid ${e.border}`, borderRadius: 12, padding: '16px 18px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
                <div style={{ width: 10, height: 10, borderRadius: '50%', background: e.ac, flexShrink: 0 }} />
                <div>
                  <div style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, fontSize: 13, color: e.ac }}>{e.title}</div>
                  <div style={{ fontSize: 11, color: e.ac, opacity: 0.8 }}>{e.sub}</div>
                </div>
              </div>
              <p style={{ fontSize: 13, color: C.textSub, lineHeight: 1.6, marginBottom: 6 }}>{e.desc}</p>
              <p style={{ fontSize: 12, color: C.textMuted, fontStyle: 'italic' }}>💬 {e.analogy}</p>
            </div>
          ))}
        </div>
      </SectionBlock>

      <SectionBlock title="Transições entre estados" color={color}>
        <div style={{ overflowX: 'auto' }}>
          <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13 }}>
            <thead>
              <tr style={{ background: '#f9fafb' }}>
                {['De', 'Para', 'Quando ocorre'].map(h => (
                  <th key={h} style={{ padding: '10px 12px', textAlign: 'left', fontWeight: 600, color: C.textMuted, borderBottom: `1px solid ${C.border}` }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {transitions.map((t, i) => (
                <tr key={i} style={{ borderBottom: `1px solid ${C.border}` }}>
                  <td style={{ padding: '10px 12px' }}><span style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 600, fontSize: 12, background: '#f4f4f5', padding: '2px 8px', borderRadius: 4 }}>{t.de}</span></td>
                  <td style={{ padding: '10px 12px' }}><span style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 600, fontSize: 12, background: '#f4f4f5', padding: '2px 8px', borderRadius: 4 }}>{t.para}</span></td>
                  <td style={{ padding: '10px 12px', color: C.textSub }}>{t.quando}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </SectionBlock>

      <SectionBlock title="Preempção" color={color}>
        <div style={{ background: '#fff7ed', border: '1px solid #fed7aa', borderRadius: 10, padding: '16px 20px' }}>
          <div style={{ fontWeight: 700, color: '#c2410c', marginBottom: 8, fontSize: 15 }}>O que é preempção?</div>
          <P>Preempção é quando o sistema operacional interrompe um processo que está RUNNING e o manda de volta para READY — <strong>sem que o processo tenha pedido isso</strong>.</P>
          <P mt={10}>Isso acontece quando o tempo de CPU do processo esgota (no Round Robin) ou quando um processo mais urgente precisa executar.</P>
          <p style={{ marginTop: 12, fontSize: 13, color: C.textMuted, fontStyle: 'italic' }}>Nem todos os algoritmos usam preempção — veremos isso no próximo módulo.</p>
        </div>
      </SectionBlock>
    </div>
  );
}

// ── Conteúdo: Módulo 3 — Algoritmos ──────────────────────────────────────────

function AlgoritmosContent({ color }) {
  const concepts = [
    { term: 'Burst de CPU', def: 'Tempo que um processo usa o processador de forma contínua antes de precisar de IO ou terminar. Base para SJF e SRTF.' },
    { term: 'Quantum', def: 'Tempo máximo que um processo pode usar o processador de uma vez. Após o quantum, sofre preempção e volta para READY. Usado no Round Robin.' },
    { term: 'Tempo de espera', def: 'Quanto tempo o processo ficou na fila READY esperando executar. Bons algoritmos tentam minimizar isso.' },
    { term: 'Turnaround', def: 'Tempo total desde que o processo foi criado até ser finalizado. Inclui espera + execução.' },
    { term: 'Preempção', def: 'O SO interrompe um processo em execução para dar o processador a outro. Algoritmos preemptivos fazem isso; não-preemptivos não.' },
  ];

  const algos = [
    {
      name: 'FIFO', full: 'First In, First Out', color: '#4A7FE8', tag: 'Não-preemptivo',
      rule: 'O primeiro processo que entrou na fila é o primeiro a executar.',
      example: 'P1 (burst 8ms) → P2 (burst 4ms) → P3 (burst 2ms), chegando nessa ordem\n\nExecução: [P1: 0–8]  [P2: 8–12]  [P3: 12–14]\n\nEspera:  P1=0ms  P2=8ms  P3=12ms  →  média: 6,6ms',
      pros: 'Simples de implementar. Sem starvation — todo processo eventualmente executa.',
      cons: 'Efeito comboio — processos curtos ficam presos atrás de processos longos.',
    },
    {
      name: 'SJF', full: 'Shortest Job First', color: '#47A96A', tag: 'Não-preemptivo',
      rule: 'Entre os processos prontos, o que tiver o menor burst de CPU executa primeiro.',
      example: 'P1 (burst 8ms)  P2 (burst 4ms)  P3 (burst 2ms)  —  todos chegam em t=0\n\nExecução: [P3: 0–2]  [P2: 2–6]  [P1: 6–14]\n\nEspera:  P1=6ms  P2=2ms  P3=0ms  →  média: 2,6ms  ← melhor!',
      pros: 'Minimiza o tempo médio de espera — ótimo matematicamente para esse critério.',
      cons: 'Precisa saber o burst antecipadamente. Starvation possível para processos longos.',
    },
    {
      name: 'SRTF', full: 'Shortest Remaining Time First', color: '#E8794A', tag: 'Preemptivo',
      rule: 'Sempre executa o processo com o menor tempo RESTANTE de burst. Um novo processo com burst menor interrompe o atual.',
      example: 't=0: P1 chega (burst 8ms)  →  começa executar\nt=2: P2 chega (burst 4ms)\n      P1 tem 6ms restantes, P2 tem 4ms  →  P2 preempção P1!\nt=6: P2 termina  →  P1 volta com 6ms restantes\nt=12: P1 termina',
      pros: 'Ótimo para minimizar tempo médio de espera com chegadas dinâmicas.',
      cons: 'Alto overhead de troca de contexto. Starvation ainda possível.',
    },
    {
      name: 'Round Robin', full: 'Round Robin', color: '#B85AC4', tag: 'Preemptivo',
      rule: 'Cada processo recebe um quantum de tempo. Após o quantum, vai para o fim da fila READY e o próximo executa.',
      example: 'quantum=3ms  |  P1 (8ms)  P2 (4ms)  P3 (2ms)  —  todos em t=0\n\n[P1: 0–3] [P2: 3–6] [P3: 6–8] [P1: 8–11] [P2: 11–12] [P1: 12–14]\n\nP3 terminou em t=8  ·  P2 em t=12  ·  P1 em t=14',
      pros: 'Justo — cada processo recebe fatias iguais. Bom tempo de resposta para sistemas interativos.',
      cons: 'Escolher o quantum certo é difícil. Turnaround pode ser pior que SJF.',
    },
  ];

  const comparison = [
    { algo: 'FIFO',       pre: 'Não', burst: 'Não', starv: 'Não',      best: 'Sistemas batch simples' },
    { algo: 'SJF',        pre: 'Não', burst: 'Sim', starv: 'Possível', best: 'Minimizar tempo médio de espera' },
    { algo: 'SRTF',       pre: 'Sim', burst: 'Sim', starv: 'Possível', best: 'Chegadas dinâmicas, tempo mínimo' },
    { algo: 'Round Robin',pre: 'Sim', burst: 'Não', starv: 'Não',      best: 'Sistemas interativos' },
  ];

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
      <SectionBlock title="O problema do escalonamento" color={color}>
        <P>Com vários processos em READY ao mesmo tempo e apenas um processador disponível, alguém precisa decidir: <strong>quem executa agora?</strong></P>
        <P mt={10}>Essa decisão é tomada pelo <strong>escalonador</strong>, e a regra que ele segue é o <strong>algoritmo de escalonamento</strong>. Diferentes algoritmos priorizam coisas diferentes — nenhum é perfeito para todos os casos.</P>
      </SectionBlock>

      <SectionBlock title="Conceitos importantes" color={color}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
          {concepts.map(c => (
            <div key={c.term} style={{ display: 'flex', gap: 12, alignItems: 'flex-start' }}>
              <div style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, fontSize: 11, color, background: color + '18', padding: '3px 10px', borderRadius: 6, flexShrink: 0, marginTop: 2, whiteSpace: 'nowrap' }}>{c.term}</div>
              <p style={{ fontSize: 14, color: C.textSub, lineHeight: 1.6 }}>{c.def}</p>
            </div>
          ))}
        </div>
      </SectionBlock>

      {algos.map(a => (
        <SectionBlock key={a.name} title={`${a.name} — ${a.full}`} color={a.color}>
          <div style={{ display: 'inline-block', background: a.color + '18', color: a.color, fontSize: 11, fontWeight: 700, padding: '2px 10px', borderRadius: 100, marginBottom: 12 }}>{a.tag}</div>
          <P><strong>Regra:</strong> {a.rule}</P>
          <div style={{ margin: '14px 0', background: '#f9fafb', border: `1px solid ${C.border}`, borderRadius: 8, padding: '14px 16px', fontFamily: "'JetBrains Mono', monospace", fontSize: 12, color: C.textSub, lineHeight: 1.8, whiteSpace: 'pre' }}>
            {a.example}
          </div>
          <div style={{ display: 'flex', gap: 16, flexWrap: 'wrap' }}>
            <div style={{ flex: 1, minWidth: 180 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: '#16a34a', marginBottom: 4 }}>✓ Vantagens</div>
              <p style={{ fontSize: 13, color: C.textSub, lineHeight: 1.5 }}>{a.pros}</p>
            </div>
            <div style={{ flex: 1, minWidth: 180 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: '#dc2626', marginBottom: 4 }}>✗ Desvantagens</div>
              <p style={{ fontSize: 13, color: C.textSub, lineHeight: 1.5 }}>{a.cons}</p>
            </div>
          </div>
        </SectionBlock>
      ))}

      <SectionBlock title="Comparativo rápido" color={color}>
        <div style={{ overflowX: 'auto' }}>
          <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13 }}>
            <thead>
              <tr style={{ background: '#f9fafb' }}>
                {['Algoritmo', 'Preemptivo?', 'Precisa do burst?', 'Starvation?', 'Melhor para'].map(h => (
                  <th key={h} style={{ padding: '10px 12px', textAlign: 'left', fontWeight: 600, color: C.textMuted, borderBottom: `1px solid ${C.border}` }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {comparison.map((r, i) => (
                <tr key={i} style={{ borderBottom: `1px solid ${C.border}` }}>
                  <td style={{ padding: '10px 12px', fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, fontSize: 12 }}>{r.algo}</td>
                  <td style={{ padding: '10px 12px', color: r.pre === 'Sim' ? '#16a34a' : C.textSub, fontWeight: r.pre === 'Sim' ? 600 : 400 }}>{r.pre}</td>
                  <td style={{ padding: '10px 12px', color: r.burst === 'Sim' ? '#c2410c' : C.textSub }}>{r.burst}</td>
                  <td style={{ padding: '10px 12px', color: r.starv === 'Não' ? '#16a34a' : '#c2410c', fontWeight: 600 }}>{r.starv}</td>
                  <td style={{ padding: '10px 12px', color: C.textSub }}>{r.best}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </SectionBlock>
    </div>
  );
}

// ── Barra de progresso global ─────────────────────────────────────────────────

function ProgressNav({ step }) {
  const items = [
    { key: 'content_processos', label: 'Processos',   color: MOD.processos.color },
    { key: 'quiz_processos',    label: 'Quiz 1',      color: MOD.processos.color },
    { key: 'content_estados',   label: 'Estados',     color: MOD.estados.color },
    { key: 'quiz_estados',      label: 'Quiz 2',      color: MOD.estados.color },
    { key: 'content_algoritmos',label: 'Algoritmos',  color: MOD.algoritmos.color },
    { key: 'quiz_algoritmos',   label: 'Quiz 3',      color: MOD.algoritmos.color },
  ];
  const curIdx = STEPS.indexOf(step);

  return (
    <div style={{ background: C.surface, borderBottom: `1px solid ${C.border}`, padding: '14px 24px' }}>
      <div style={{ maxWidth: 900, margin: '0 auto', display: 'flex', alignItems: 'center' }}>
        {items.map((s, i) => {
          const sIdx = STEPS.indexOf(s.key);
          const done = sIdx < curIdx;
          const active = sIdx === curIdx;
          return (
            <React.Fragment key={s.key}>
              <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, minWidth: 70 }}>
                <div style={{ width: 26, height: 26, borderRadius: '50%', background: done || active ? s.color : '#e4e4e7', display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'background 200ms' }}>
                  {done
                    ? <span style={{ color: '#fff', fontSize: 13, fontWeight: 700 }}>✓</span>
                    : active
                      ? <span style={{ width: 8, height: 8, borderRadius: '50%', background: '#fff' }} />
                      : <span style={{ width: 6, height: 6, borderRadius: '50%', background: '#a1a1aa' }} />
                  }
                </div>
                <span style={{ fontSize: 10, fontWeight: active ? 700 : 500, color: active || done ? s.color : C.textMuted, whiteSpace: 'nowrap' }}>{s.label}</span>
              </div>
              {i < items.length - 1 && (
                <div style={{ flex: 1, height: 2, background: STEPS.indexOf(items[i+1].key) <= curIdx ? items[i+1].color : '#e4e4e7', marginBottom: 16, transition: 'background 300ms' }} />
              )}
            </React.Fragment>
          );
        })}
      </div>
    </div>
  );
}

// ── Tela de quiz ──────────────────────────────────────────────────────────────

function QuizScreen({ module, onComplete }) {
  const meta = MOD[module];
  const raw = QUIZZES[module];

  const makeQuestions = () => shuffle(raw).map(q => ({
    ...q,
    shuffled: shuffle(q.opts.map((text, i) => ({ text, orig: i }))),
  }));

  const [questions, setQuestions] = React.useState(makeQuestions);
  const [idx, setIdx] = React.useState(0);
  const [selected, setSelected] = React.useState(null);
  const [confirmed, setConfirmed] = React.useState(false);
  const [score, setScore] = React.useState(0);
  const [log, setLog] = React.useState([]);
  const [done, setDone] = React.useState(false);

  const q = questions[idx];
  const correctPos = q ? q.shuffled.findIndex(o => o.orig === q.ans) : -1;
  const wasCorrect = selected === correctPos;

  function confirm() {
    if (selected === null || confirmed) return;
    const ok = selected === correctPos;
    setConfirmed(true);
    if (ok) setScore(s => s + 1);
    setLog(l => [...l, ok]);
  }

  function next() {
    if (idx + 1 >= questions.length) { setDone(true); return; }
    setIdx(i => i + 1);
    setSelected(null);
    setConfirmed(false);
  }

  function retry() {
    setQuestions(makeQuestions());
    setIdx(0); setSelected(null); setConfirmed(false);
    setScore(0); setLog([]); setDone(false);
  }

  if (done) {
    const passed = score >= 5;
    return (
      <div style={{ maxWidth: 580, margin: '0 auto', padding: '60px 24px', textAlign: 'center' }}>
        <div style={{ fontSize: 56, marginBottom: 16 }}>{passed ? '🎉' : '📋'}</div>
        <h2 style={{ fontSize: 28, fontWeight: 800, color: C.text, marginBottom: 10 }}>{passed ? 'Aprovado!' : 'Tente novamente'}</h2>
        <p style={{ fontSize: 16, color: C.textSub, marginBottom: 40 }}>
          Você acertou <strong>{score} de {questions.length}</strong> questões.{' '}
          {passed ? 'Pode avançar!' : 'Você precisa de pelo menos 5 acertos.'}
        </p>

        <div style={{ display: 'flex', justifyContent: 'center', gap: 8, marginBottom: 40, flexWrap: 'wrap' }}>
          {log.map((ok, i) => (
            <div key={i} style={{ width: 40, height: 40, borderRadius: 8, background: ok ? '#dcfce7' : '#fee2e2', border: `2px solid ${ok ? '#16a34a' : '#dc2626'}`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700, fontSize: 14, color: ok ? '#16a34a' : '#dc2626' }}>
              {ok ? '✓' : '✗'}
            </div>
          ))}
        </div>

        {passed ? (
          <button onClick={() => onComplete(score)} style={{ background: meta.color, color: '#fff', border: 'none', borderRadius: 10, padding: '13px 32px', fontFamily: "'Inter', sans-serif", fontWeight: 700, fontSize: 15, cursor: 'pointer' }}>
            Avançar →
          </button>
        ) : (
          <button onClick={retry} style={{ background: meta.color, color: '#fff', border: 'none', borderRadius: 10, padding: '13px 32px', fontFamily: "'Inter', sans-serif", fontWeight: 700, fontSize: 15, cursor: 'pointer' }}>
            ↺ Tentar novamente
          </button>
        )}
      </div>
    );
  }

  return (
    <div style={{ maxWidth: 660, margin: '0 auto', padding: '40px 24px 80px' }}>
      {/* Cabeçalho quiz */}
      <div style={{ marginBottom: 32 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
          <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.14em', textTransform: 'uppercase', color: meta.color }}>Quiz {meta.num} — {meta.label}</span>
          <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 13, color: C.textMuted }}>{idx + 1} / {questions.length}</span>
        </div>
        <div style={{ height: 4, background: C.border, borderRadius: 2, overflow: 'hidden', marginBottom: 8 }}>
          <div style={{ height: '100%', background: meta.color, borderRadius: 2, width: `${(idx / questions.length) * 100}%`, transition: 'width 300ms' }} />
        </div>
        <div style={{ display: 'flex', gap: 4 }}>
          {log.map((ok, i) => <div key={i} style={{ width: 8, height: 8, borderRadius: '50%', background: ok ? '#16a34a' : '#dc2626' }} />)}
          {Array.from({ length: questions.length - log.length }).map((_, i) => <div key={i} style={{ width: 8, height: 8, borderRadius: '50%', background: C.border }} />)}
        </div>
      </div>

      {/* Pergunta */}
      <div style={{ ...cardStyle, marginBottom: 20 }}>
        <p style={{ fontSize: 17, fontWeight: 600, color: C.text, lineHeight: 1.55 }}>{q.q}</p>
      </div>

      {/* Opções */}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginBottom: 24 }}>
        {q.shuffled.map((opt, i) => {
          let bg = C.surface, border = C.border, tc = C.text;
          if (confirmed) {
            if (i === correctPos) { bg = '#dcfce7'; border = '#16a34a'; tc = '#166534'; }
            else if (i === selected && !wasCorrect) { bg = '#fee2e2'; border = '#dc2626'; tc = '#991b1b'; }
          } else if (selected === i) {
            bg = meta.color + '12'; border = meta.color;
          }
          return (
            <button
              key={i}
              onClick={() => { if (!confirmed) setSelected(i); }}
              style={{ background: bg, border: `2px solid ${border}`, borderRadius: 12, padding: '14px 20px', textAlign: 'left', fontFamily: "'Inter', sans-serif", fontSize: 14, color: tc, lineHeight: 1.5, cursor: confirmed ? 'default' : 'pointer', transition: 'all 150ms', fontWeight: confirmed && i === correctPos ? 600 : 400 }}
            >
              <span style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, marginRight: 10, color: confirmed ? 'inherit' : meta.color }}>{['A', 'B', 'C', 'D'][i]}</span>
              {opt.text}
            </button>
          );
        })}
      </div>

      {/* Feedback */}
      {confirmed && (
        <div style={{ background: wasCorrect ? '#f0fdf4' : '#fef2f2', border: `1px solid ${wasCorrect ? '#bbf7d0' : '#fecaca'}`, borderRadius: 12, padding: '16px 20px', marginBottom: 20 }}>
          <div style={{ fontWeight: 700, fontSize: 14, color: wasCorrect ? '#166534' : '#991b1b', marginBottom: 6 }}>{wasCorrect ? '✓ Correto!' : '✗ Incorreto'}</div>
          <p style={{ fontSize: 14, color: wasCorrect ? '#15803d' : '#b91c1c', lineHeight: 1.6 }}>{wasCorrect ? q.fc : q.fi}</p>
        </div>
      )}

      {!confirmed ? (
        <button
          onClick={confirm}
          disabled={selected === null}
          style={{ background: selected !== null ? meta.color : C.border, color: selected !== null ? '#fff' : C.textMuted, border: 'none', borderRadius: 10, padding: '12px 28px', fontFamily: "'Inter', sans-serif", fontWeight: 700, fontSize: 14, cursor: selected !== null ? 'pointer' : 'not-allowed', transition: 'all 150ms' }}
        >
          Confirmar
        </button>
      ) : (
        <button
          onClick={next}
          style={{ background: meta.color, color: '#fff', border: 'none', borderRadius: 10, padding: '12px 28px', fontFamily: "'Inter', sans-serif", fontWeight: 700, fontSize: 14, cursor: 'pointer' }}
        >
          {idx + 1 >= questions.length ? 'Ver resultado →' : 'Próxima →'}
        </button>
      )}
    </div>
  );
}

            </div>
          );
        })}
      </div>

      <a href="index.html" style={{ display: 'inline-block', background: '#18181b', color: '#fff', borderRadius: 12, padding: '16px 44px', fontFamily: "'Inter', sans-serif", fontWeight: 700, fontSize: 16, textDecoration: 'none' }}>
        Ir para o Simulador →
      </a>

}

// ── App ───────────────────────────────────────────────────────────────────────

function App() {
  const saved = loadProgress();
  const [step, setStep] = React.useState(saved?.step || 'content_processos');
  const [results, setResults] = React.useState(saved?.results || {});

  React.useEffect(() => {
    saveProgress({ step, results });
    if (step === 'completed') {
      try { localStorage.setItem('learn:completed', 'true'); } catch {}
    }
  }, [step, results]);

  function go(s) {
    setStep(s);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function finishQuiz(module, score) {
    setResults(r => ({ ...r, [module]: score }));
    const next = STEPS[STEPS.indexOf(`quiz_${module}`) + 1];
    go(next);
  }

  const render = () => {
    if (step === 'completed') return <CompletedScreen results={results} />;
    const [phase, module] = step.split('_');
    if (phase === 'content') return <ContentScreen module={module} onNext={() => go(`quiz_${module}`)} />;
    if (phase === 'quiz') return <QuizScreen module={module} onComplete={(s) => finishQuiz(module, s)} />;
    return null;
  };

  return (
    <div style={{ minHeight: '100vh', background: C.bg }}>
      {step !== 'completed' && <ProgressNav step={step} />}
      {render()}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
