<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Simulação de Escalonamento</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f4f4f5; font-family: 'Inter', system-ui, sans-serif; }
  #root { position: fixed; inset: 0; }
  .back-btn {
    position: fixed; left: 20px; bottom: 80px;
    background: rgba(20,20,20,0.92); color: #fafafa;
    border: 1px solid rgba(255,255,255,0.12); border-radius: 8px;
    padding: 10px 16px; cursor: pointer; font-family: inherit;
    font-size: 13px; font-weight: 600; letter-spacing: 0.02em;
    z-index: 9998; text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .back-btn:hover { background: rgba(40,40,40,0.95); }
</style>
</head>
<body>
<div id="root"></div>

<script>
  // Lê parâmetros da URL: ?algo=fifo (ou sjf, srtf, rr)
  (function() {
    const p = new URLSearchParams(window.location.search);
    window.SIM_ALGO = p.get('algo') || 'fifo';
    window.SIM_FROM = p.get('from') || 'index';
  })();

  window.TWEAK_DEFAULTS = {
    "cardHeight": 72,
    "cardGap": 10,
    "topOffset": 150,
    "modalPaddingH": 38
  };
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="simulator.js"></script>
<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="scene.jsx"></script>

<script type="text/babel">
  function App() {
    const algo = window.SIM_ALGO;
    const scenario = window.Scheduler.SCENARIOS[algo] || window.Scheduler.SCENARIOS.fifo;
    const procs = scenario.processes;
    const quantum = scenario.quantum || 3;

    const timeline = React.useMemo(() => {
      return window.Scheduler[algo]({ processes: procs, quantum });
    }, [algo]);

    const tweaks = window.TWEAK_DEFAULTS;
    const totalCycles = Math.max(...timeline.map(e => e.cycle));
    const duration = INTRO_DURATION + (totalCycles + 1) * CYCLE_DURATION + 3;

    const backHref = window.SIM_FROM === 'challenge'
      ? `challenge.html?algo=${algo}`
      : 'index.html';

    const persistKey = `sim-${algo}-v1`;

    return (
      <>
        <Stage
          width={1920}
          height={1080}
          duration={duration}
          background="#ffffff"
          persistKey={persistKey}
          loop={true}
        >
          <SimulationScene
            timeline={timeline}
            tweaks={tweaks}
            procs={procs}
            quantum={quantum}
            algo={algo}
          />
        </Stage>

        <a className="back-btn" href={backHref}>← Voltar</a>
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
